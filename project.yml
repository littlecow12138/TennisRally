name: TennisRally
options:
  bundleIdPrefix: ai.tennismrally
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1"
  SWIFT_VERSION: "5.0"
targets:
  TennisRally:
    type: application
    platform: iOS
    sources:
      - path: TennisRally
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.tennismrally.app
      INFOPLIST_KEY_CFBundleDisplayName: TennisRally
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import tennis practice videos to split into rallies offline.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    info:
      path: TennisRally/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleLocalizations:
          - en
          - zh-Hans
  TennisRallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TennisRallyTests
    dependencies:
      - target: TennisRally
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.tennismrally.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TennisRally.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TennisRally"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TennisRally:
    build:
      targets:
        TennisRally: all
        TennisRallyTests: [test]
    test:
      config: Debug
      targets:
        - TennisRallyTests
      gatherCoverageData: false
